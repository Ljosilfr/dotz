#------------------------------------#
monitor = VGA-1, 1440x900@75, 0x0, 1
#------------------------------------#
$mainMod = SUPER
$auxMod = Alt
$minMod = Ctrl
$null =
#------------------#
$terminal = foot
$fileManager = pcmanfm-qt
#--------------------------#
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = sleep 2 && /usr/lib/xdg-desktop-portal &
exec-once = systemctl --user start hyprpolkitagent
#--------------------------#
exec-once = swww-daemon
exec-once = hypridle
exec-once = waybar
exec-once = easyeffects --gapplication-service
#--------------------------#
#  HYPRLAND VARIABLES
#----------------------#
general {
	gaps_in = 4
	gaps_out = 6
	border_size = 1
	col.active_border = rgb(FF4BA8)
	col.inactive_border = rgba(C5CBFC99)
	layout = dwindle
	allow_tearing = false
}
cursor {
	hide_on_key_press = true
	no_warps = false
	enable_hyprcursor = false
}
render {
	cm_auto_hdr = 0
	new_render_scheduling = true
	direct_scanout = 2
}
decoration {
	rounding = 8
	rounding_power = 1
	#----------------------#
	shadow {
	enabled = true
	sharp = true
        range = 1
        color = rgba(000000cc)
    }
	blur {
	enabled = false
    }
}
misc {
	vfr = 0
	force_default_wallpaper = 0
	disable_hyprland_logo = true
	background_color = rgb(121212)
}
input {
	kb_layout = latam
	kb_options = grp:alt_shift_toggle, compose:menu
	numlock_by_default = true
	accel_profile = flat
	natural_scroll = true
	sensitivity = 0
}
animations {
	enabled = false
}
dwindle {
	pseudotile = false
	preserve_split = true
}
master {
	new_status = master
}
ecosystem {
	enforce_permissions = 1
}
#-------------------------------#
#    ENVIRONMENT VARIABLES
#-----------------------------#
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
#-----------------------------#
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
#-----------------------------------#
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
#--------------------------------------#
env = XCURSOR_THEME,Simp1e-Tokyo-Night
env = XCURSOR_SIZE,24
env = PATH,$PATH:/home/fenrjon/misc/skrtz
env = SWWW_TRANSITION,none
#-----------------------------#
#     		BINDS
#-------------------------------------#
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, C, exec, hyprpicker -a
bind = $mainMod, F11, fullscreenstate, 0 2
bind = $null, F11, fullscreen
bind = $minMod_L_$auxMod, Delete, exec, wleave
bind = $null, F12, exec, pkill -SIGUSR1 waybar
#--------------------------------------#
bind = $mainMod, KP_UP, movewindow, u
bind = $mainMod, KP_BEGIN, movewindow, d
bind = $mainMod, KP_RIGHT, movewindow, r
bind = $mainMod, KP_LEFT, movewindow, l
#----------------------------#
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
#-------------------------------#
bind = $null, page_down, workspace, e+1
bind = $null, page_up, workspace, e-1
#--------------------------#
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
#-------------------------------------#
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
#-------------------------------------#
bind = $null, Print, exec, take_screenshot --section
bind = $mainMod, Print, exec, take_screenshot --output
bind = $mainMod_Alt, R, exec, screenrcrd_toggle
#-------------------------------------#
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
#--------------------------------------------#
binde = $mainMod_$auxMod , right, resizeactive, 50 0
binde = $mainMod_$auxMod, left, resizeactive, -50 0
binde = $mainMod_$auxMod, up, resizeactive, 0 -50
binde = $mainMod_$auxMod, down, resizeactive, 0 50
#--------------------------------------------#
bind = $mainMod, Super_R, exec, app_launcher
bind = $auxMod, Tab, exec, workspace_switch
bind = $mainMod, space, exec, connection_select
#-----------------------------------------------#
# 		WINDOW RULES
#----------------------------------------#
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
#--------------------------------#
windowrule = workspace 1,title:.*Brave.*
windowrule = workspace empty,title:.*Private Tab.*
#--------------------------------#
windowrule = fullscreenstate: 0 2,class:brave-agimnkijcaahngcdmfeangaknmldooml-Default,title:^(YouTube)$
windowrule = workspace empty,class:brave-agimnkijcaahngcdmfeangaknmldooml-Default,title:^(YouTube)$
#-----------------------------------------------------------#
windowrule = fullscreenstate 0 2,title:^(P-Stream)$
windowrule = workspace empty,title:^(P-Stream)$
#
windowrule = fullscreenstate 0 2,title:.*AnimeKAI.*
windowrule = workspace empty,title:.*AnimeKAI.*
#
windowrule = fullscreenstate 0 2,title:.*Discord.*
windowrule = workspace empty,title:.*Discord.*
#
windowrule = fullscreenstate 0 2,title:.*Reddit.*
windowrule = workspace empty,title:.*Reddit.*
#
windowrule = fullscreenstate 0 2,title:^(Pinterest)$
windowrule = workspace empty,title:^(Pinterest)$
#
windowrule = fullscreenstate 0 2,title:^(Instagram)$
windowrule = workspace empty,title:^(Instagram)$
#
windowrule = fullscreenstate 0 2,title:^(Facebook)$
windowrule = workspace empty,title:^(Facebook)$
#--------------------------------------------#
windowrule = fullscreenstate 0 2,title:^(GitHub)$
windowrule = fullscreenstate 0 2,title:^(Messenger)$
windowrule = fullscreenstate 0 2,title:^(ChatGPT)$
windowrule = fullscreenstate 0 2,title:^(Proton Mail)$
windowrule = fullscreenstate 0 2,title:^(ArchWiki)$
windowrule = fullscreenstate 0 2,title:^(Hyprland Wiki)$
#-----------------------------------------------------#
windowrule = workspace empty,fullscreen,class:com.github.rafostar.Clapper
windowrule = workspace empty,class:com.github.johnfactotum.Foliate
windowrule = workspace empty,class:spotify
windowrule = workspace empty,class:gimp
windowrule = workspace empty,class:com.libretro.RetroArch
windowrule = workspace empty,title:Lutris
windowrule = workspace empty,class:mpv
#--------------------------------------------#
windowrule = tile, title:org-jdownloader-update-launcher-JDLauncher
#--------------------------------------------#
windowrule = float,class:com.saivert.pwvucontrol
windowrule = center 1,class:com.saivert.pwvucontrol
windowrule = size 800 360,class:com.saivert.pwvucontrol
#--------------------------------------------------#
windowrule = float, -size 352 418, class:^(org.kde.kalk)$
windowrule = float,class:nwg-look
windowrule = float,class:selectdefaultapplication
#----------------------------------#
windowrule = rounding 7, floating:1
#---------------------------------------------------------#
#		Games Rules
#---------------------------------------------#
windowrule = fullscreen,class:PPSSPPSDL
windowrule = workspace empty,class:PPSSPPSDL
#---------------------------------------#
windowrule = content game,title:Assassin's Creed
windowrule = fullscreen,title:Assassin's Creed
#------------------------------------#
windowrule = content game,title:Skyrim
windowrule = fullscreen,title:Skyrim
#-------------------------------#
windowrule = content game,title:DARK SOULS
windowrule = fullscreen,title:DARK SOULS
#------------------------------------#
windowrule = content game,title:Age of Empires
windowrule = fullscreen,title:Age of Empires
#----------------------------------------------#
#	 PERMISSIONS
#-----------------------------#
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
permission = /usr/bin/hyprpicker, screencopy, allow
permission = /usr/bin/wayshot, screencopy, allow
permission = /usr/bin/wl-screenrec, screencopy, allow
