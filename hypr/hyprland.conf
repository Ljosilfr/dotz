#------------------------------------#
monitor = VGA-1, 1440x900@60, 0x0, 1
#------------------------------------#
$mainMod = SUPER
$auxMod = Alt
$midMod = Shift
$minMod = Ctrl
$null =
#------------------#
$terminal = foot
$fileManager = pcmanfm-qt
#--------------------------#
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = sleep 2 && /usr/lib/xdg-desktop-portal &
exec-once = systemctl --user start hyprpolkitagent
#--------------------------#
exec-once = swww-daemon
exec-once = foot --server
exec-once = hypridle
exec-once = waybar
exec-once = easyeffects --service-mode -w
exec-once = wl-paste --type text --watch cliphist store
#--------------------------#
#  HYPRLAND VARIABLES
#----------------------#
general {
	gaps_in = 4
	gaps_out = 12
	border_size = 1
	col.active_border = rgb(baccff)
	col.inactive_border = rgba(c5ccfc44)
	layout = dwindle
	allow_tearing = true
}
dwindle {
	force_split = 2
	pseudotile = true
	preserve_split = true
	use_active_for_splits = true
}
cursor {
	hide_on_key_press = true
	no_warps = false
	enable_hyprcursor = false
}
render {
	cm_auto_hdr = 0
	new_render_scheduling = true
	direct_scanout = 2
}
decoration {
	rounding = 10
	rounding_power = 3
	#----------------------#
	shadow {
	enabled = true
    }
	blur {
	enabled = false 
    }
}
misc {
	disable_hyprland_logo = true
	focus_on_activate = true
	force_default_wallpaper = 0
	vfr = 0
    vrr = 0
}
input {
	kb_layout = latam
	kb_options = grp:alt_shift_toggle, compose:menu
	numlock_by_default = true
	accel_profile = flat
	natural_scroll = true
	sensitivity = 0
}
animations {
	enabled = true
	#----------------------------------------------#
	animation = windowsMove, 1, 2, default, slide
	animation = windowsIn, 0
	animation = windowsOut, 0
	#-----------------------------------------------#
	animation = layers, 1, 1.25, default, slide
	#-------------------------------------------#
	animation = fade, 0
	animation = workspaces, 0
	animation = border, 0
	animation = borderangle, 0
	animation = monitorAdded, 0
	animation = zoomFactor, 0
}
ecosystem {
	enforce_permissions = 1
}
xwayland {
    force_zero_scaling = true
}
#-------------------------------#
#    ENVIRONMENT VARIABLES
#-----------------------------#
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
#-----------------------------#
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
#-----------------------------------#
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
#--------------------------------------#
env = XCURSOR_THEME,Simp1e-Tokyo-Night
env = XCURSOR_SIZE,24
env = SWWW_TRANSITION,none
#-----------------------------#
#     		BINDS
#-------------------------------------#
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating
bind = $mainMod, J, togglesplit
bind = $mainMod, A, layoutmsg, swapsplit
bind = $mainMod, P, pseudo, active
bind = $mainMod, C, exec, hyprpicker -a
bind = $mainMod, F11, fullscreenstate, 0 2
bind = $null, F11, fullscreen
bind = $minMod_L $auxMod, Delete, exec, wleave
bind = $mainMod $midMod, Q, exit 
bind = $mainMod, M, exec, mpv_stream
#----------------------------#
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
#-------------------------------#
bind = $null, page_down, workspace, e+1
bind = $null, page_up, workspace, e-1
#--------------------------#
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
#-------------------------------------#
bind = $mainMod $midMod, 1, movetoworkspace, 1
bind = $mainMod $midMod, 2, movetoworkspace, 2
bind = $mainMod $midMod, 3, movetoworkspace, 3
bind = $mainMod $midMod, 4, movetoworkspace, 4
bind = $mainMod $midMod, 5, movetoworkspace, 5
bind = $mainMod $midMod, 6, movetoworkspace, 6
bind = $mainMod $midMod, 7, movetoworkspace, 7
bind = $mainMod $midMod, 8, movetoworkspace, 8
bind = $mainMod $midMod, 9, movetoworkspace, 9
#-------------------------------------#
bind = $null, Print, exec, take_screenshot -s
bind = $mainMod, Print, exec, take_screenshot -o
bind = $mainMod $auxMod, R, exec, screenrcrd_toggle
#-------------------------------------#
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
#--------------------------------------------#
binde = $mainMod $auxMod, right, resizeactive, 50 0
binde = $mainMod $auxMod, left, resizeactive, -50 0
binde = $mainMod $auxMod, up, resizeactive, 0 -50
binde = $mainMod $auxMod, down, resizeactive, 0 50
#--------------------------------------------#
bind = $mainMod, Super_R, exec, app_launcher
bind = $mainMod, space, exec, connection_select
bind = $mainMod $auxMod, V, exec, clipboard_history
bind = $mainMod $auxMod, G, exec, game_launcher
#-----------------------------------------------#
# 		WINDOW RULES
#----------------------------------------#
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
