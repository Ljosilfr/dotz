source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/startup.conf
source = ~/.config/hypr/variables.conf
#-----------------------------------------#
monitor = VGA-1, 1440x900@60, 0x0, 1
#-------------------------------------#
general {
	gaps_in = 4
	gaps_out = 9
	border_size = 1
	col.active_border = rgb(FF0066)
	col.inactive_border = rgba(c0004088)
	allow_tearing = true
}
dwindle {
	force_split = 2
	preserve_split = true
	use_active_for_splits = true
}
cursor {
	hide_on_key_press = true
	no_warps = false
	enable_hyprcursor = false
    use_cpu_buffer = 0
}
render {
	cm_auto_hdr = 0
	new_render_scheduling = true
	direct_scanout = 2
}
decoration {
	rounding = 10
	rounding_power = 3
	#----------------------#
	shadow {
	enabled = true
    }
	blur {
	enabled = false 
    }
}
misc {
	disable_hyprland_logo = true
	focus_on_activate = true
	force_default_wallpaper = 0
	vfr = 0
    vrr = 0
}
input {
	kb_layout = latam
	kb_options = grp:alt_shift_toggle, compose:menu
	numlock_by_default = true
	accel_profile = flat
	natural_scroll = true
	sensitivity = 0
    emulate_discrete_scroll = 0
}
animations {
	enabled = true
	#----------------------------------------------#
	animation = windowsMove, 1, 2, default, slide
	animation = windowsIn, 0
	animation = windowsOut, 0
	#-----------------------------------------------#
	animation = layers, 1, 1.25, default, slide
	#-------------------------------------------#
	animation = fade, 0
	animation = workspaces, 0
	animation = border, 0
	animation = borderangle, 0
	animation = monitorAdded, 0
	animation = zoomFactor, 0
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
	enforce_permissions = 1
}
xwayland {
    force_zero_scaling = true
}
#----------------------------------------------------------------------------------------#
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
permission = /usr/bin/hyprpicker, screencopy, allow
permission = /usr/bin/wayshot, screencopy, allow
permission = /usr/bin/wl-screenrec, screencopy, allow
#--------------------------------------------------------#
