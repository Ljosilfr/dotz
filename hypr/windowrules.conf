windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

#----------------------------------------------------------------------------------------------------#
windowrule = workspace 1, match:class brave-browser, match:title ^(.* - Brave)$
windowrule = workspace empty, match:class brave-browser, match:title ^(New Private Tab - Brave)$
#------------------------------------------------------------------------------------------------#
windowrule = fullscreen_state 0 2, workspace empty, match:title ^(YouTube.*)$
windowrule = fullscreen_state 0 2, workspace empty, match:title ^(AnimeKAI.*)$
windowrule = fullscreen_state 0 2, workspace empty, match:title ^(Reddit)$
windowrule = fullscreen_state 0 2, workspace empty, match:title ^(HDTV)$
windowrule = fullscreen_state 0 2, workspace empty, match:title ^(Pinterest)$
windowrule = fullscreen_state 0 2, workspace empty, match:title ^(Facebook)$
windowrule = fullscreen_state 0 2, workspace empty, match:title ^(X)$
windowrule = fullscreen_state 0 2, workspace empty, match:title ^(Anna’s Archive.*)$
windowrule = fullscreen_state 0 2, workspace empty, match:title ^(SquidWTF.*)$
