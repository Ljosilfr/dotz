  ${color}${font}${fs_free /home}/${fs_size /home}
  ${color0}${fs_bar 4,160 /home}${color}

${font0}NETWORK${font} ${color1}${hr 1}${color}

  ${color0}${font1}󰈀 ${color}${font}${addrs eth0}
  ${voffset -15}
  ${color0}${font1}󰖂 ${color}${font}${addrs tun0}
]]
