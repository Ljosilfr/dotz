conky.text = [[
${font0}SYSTEM${font} ${color1}${hr 1}${color}

  ${color0}${font1}󰻠 ${color}${font}CPU1: ${cpu cpu1}% ${alignr}${color1}${cpubar 8,45}
  ${voffset -15}
  ${color0}${font1}󰻠 ${color}${font}CPU2: ${cpu cpu2}% ${alignr}${color1}${cpubar cpu2 8,45}
  ${voffset -15}
  ${color0}${font1}󰓡 ${color}${font}SWAP: $swapperc% ${alignr}${color1}${swapbar 8,45}
  ${voffset -15}
  ${color0}${font1}󰘚 ${color}${font}RAM: $memperc% ${alignr}${color1}${membar 8,45}${color}

${font0}STORAGE${font} ${color1}${hr 1}${color}

  ${color0}${font1}󰉐 ${color}${font}Root:
  ${fs_free /}/${fs_size /} 
  ${color0}${fs_bar 4,160 /}
  ${voffset -15}
