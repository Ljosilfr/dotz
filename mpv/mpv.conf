# ============================================================
# General behaviour
# ============================================================
fullscreen=yes
load-scripts=yes
force-seekable=yes
keep-open=always
profile=high-quality
force-window=immediate
embeddedfonts=no
alang=eng,en
slang=eng,en

# ============================================================
# Display / Video output
# ============================================================
vo=gpu
gpu-api=auto
gpu-context=auto
dither-depth=8
video-sync=display-resample
interpolation=yes
tscale=oversample
scale=ewa_lanczos
scale-radius=3

# ============================================================
# OSD (On-Screen Display)
# ============================================================
osd-font='JetBrainsMonoNL Nerd Font Propo'
osd-bold=yes
osd-font-size=16
osd-shadow-offset=0
osd-outline-size=0
osd-border-style=background-box
osd-align-x=right
osd-scale=2
osd-scale-by-window=no

osd-bar=no
osd-bar-h=0.5
osd-bar-align-x=0
osd-bar-align-y=-0.85

# ============================================================
# Subtitles
# ============================================================
sub-font='Tinos Nerd Font Propo'
sub-margin-y=86
sub-border-style=background-box
sub-outline-size=1.5
sub-shadow-offset=0
sub-ass-override=strip

# ============================================================
# Audio
# ============================================================
audio-channels=stereo
audio-normalize-downmix=yes
