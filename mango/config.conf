#---------------------------------------------------------------------------#
monitorrule=name:VGA-1,width:1440,height:900,refresh:60,scale:1,rr:0,vrr:0
#--------------------------------------------------------------------------#
source=~/.config/mango/colors.conf
#---------------#
#   Variables
#---------------------------------#
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
#-----------------------------------#
env = XDG_CURRENT_DESKTOP,wlroot
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,wlroot
#--------------------------------------------#
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
#-------------------------------------#
env = GTK_THEME,Colloid-Grey-Dark
env = XCURSOR_THEME,Simp1e-Berserk
env = XCURSOR_SIZE,24
#----------------------------------#
env = SWWW_TRANSITION,none
#----------------------------#

#-----------------------------#
# Master-Stack Layout Setting
#-------------------------------#
new_is_master=0
default_mfact=0.50
default_nmaster=1
smartgaps=0
# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
overviewgappi=5
overviewgappo=30
# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=0
cursor_hide_timeout=3
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
allow_tearing=2
syncobj_enable=1
cursor_size=24
drag_tile_to_tile=1
#-----------------------------#

#-----------#
#   Input
#-----------------------#
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=latam
xkb_rules_options=grp:alt_shift_toggle,compose:menu
#-----------------------------------------------------#
disable_trackpad=1
#---------------------------#
mouse_natural_scrolling=1
accel_profile=0
#_------------------------#

#-------------#
# Appearance
#----------------------------#
gappih=15
gappiv=15
gappoh=20
gappov=20
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
#------------------------#
blur=0
shadows = 0
border_radius=15
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
#------------------------------#

#-----------------#
# Layout Support
#-----------------------------#
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
#-----------------------------#

#-----------#
#  Keybinds
#---------------------------#
bind=SUPER,r,reload_config
#-------------------------------------#
bind=SUPER,Return,spawn,footclient
bind=SUPER,E,spawn,pcmanfm
bind=SUPER,space,spawn,app_launcher
bind=SUPER,G,spawn,game_launcher
bind=SUPER+SHIFT,F12,spawn,vpn_toggle
bind=SUPER,F3,spawn,easyeffects_preset_select
bind=SUPER,F6,spawn,wallpaper_set
bind=SUPER,C,spawn,hyprpicker -a -t
#-------------------------------------------#
bind=SUPER+SHIFT,R,spawn,screenrcrd_toggle
bind=NONE,Print,spawn,wayshot -g
bind=SUPER,Print,spawn,wayshot
#---------------------------------------------------------------------------------------------------#
bind = SUPER,V,spawn_shell,footclient sh -c "(cat ~/.cache/wallust/sequences &); wiremix"
bind = SUPER,M,spawn_shell,footclient sh -c "(cat ~/.cache/wallust/sequences &); rmpc"
bind = SUPER,Y,spawn_shell,footclient sh -c "(cat ~/.cache/wallust/sequences &); yazi"
bind = SUPER,F12,spawn_shell,footclient sh -c "(cat ~/.cache/wallust/sequences &); btop"
#------------------------------------------------------------------------------------------------#
bind=SUPER+SHIFT,q,quit
bind=Super,q,killclient,
#---------------------------------#
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
#--------------------------------------------#
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
#--------------------------------------------#
bind=ALT,Tab,toggleoverview,
bind=SUPER,F,togglefloating,
bind=SUPER+SHIFT,M,togglemaximizescreen,
bind=NONE,F11,togglefullscreen,
bind=SUPER,F11,togglefakefullscreen,
bind=SUPER,I,minimized,
bind=SUPER,O,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
#-------------------------------------#
bind=SUPER,n,switch_layout
#----------------------------------------#
bind=NONE,Page_Up,viewtoleft_have_client,
bind=NONE,Page_Down,viewtoright_have_client,
#--------------------------------------------#
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
#----------------------------#
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
#-----------------------------------#
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
#---------------------------------------#
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0
#------------------------------------#
bind=SUPER+ALT,Up,resizewin,+0,-50
bind=SUPER+ALT,Down,resizewin,+0,+50
bind=SUPER+ALT,Left,resizewin,-50,+0
bind=SUPER+ALT,Right,resizewin,+50,+0
#-------------------------------------------------#
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,1
mousebind=NONE,btn_right,killclient,0
#-----------------------------------------------#
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
#---------------------------------------------#

#------------------------------------------#
windowrule=force_tearing:1,appid:gamescope
#-------------------------------------------#

#-------------------#
#   Animations
#--------------------------#
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=0
animation_fade_out=0
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0
fadeout_begin_opacity=0
animation_duration_move=100
animation_duration_open=100
animation_duration_tag=0
animation_duration_close=100
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1
#-------------------------------------------#

#-----------------------------------------------------#
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent 
#--------------------------------------------------#
exec-once = easyeffects --service-mode -w
exec-once = swww-daemon
exec-once = udiskie
exec-once = waybar
exec-once = waybar_widget
exec-once = swayidle_init
exec-once = foot --server
exec-once = wl-paste --watch clipvault store
exec-once = dbus-update-activation-environment --all
#---------------------------------------------------------#
