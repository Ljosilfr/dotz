#———————————————————————————————————————————————————————————————————————————|
monitorrule=name:VGA-1,width:1440,height:900,refresh:60,scale:1,rr:0,vrr:0
#———————————————————————————————————————————————————————————————————————————|
source=~/.config/mango/animations.conf
source=~/.config/mango/colors.conf
source=~/.config/mango/keybinds.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/scratchpad.conf
source=~/.config/mango/startup.conf
source=~/.config/mango/variables.conf
#—————————————————————————————————————————|

#——————————|
gappih=6
gappiv=6
gappoh=10
gappov=10
#—»
borderpx=1
no_border_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
#—————————————————————————|

#——————————————————————————————————————————|
circle_layout=dwindle,monocle,scroller
#—»
scroller_structs = 10
scroller_default_proportion = 0.99
scroller_default_proportion_single = 1.00
scroller_ignore_proportion_single = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 35
scroller_focus_center = 0
scroller_prefer_center = 1
scroller_prefer_overspread = 1
#——————————————————————————————————————————|
hotarea_size=10
hotarea_corner=1
enable_hotarea=1
ov_no_resize=1
ov_tab_mode=1
#—»
overviewgappi=5
overviewgappo=30
#——————————————————|

#—————————————————————————————|
axis_bind_apply_timeout=100
idleinhibit_ignore_visible=0
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0
sloppyfocus=1
drag_tile_to_tile=1
enable_floating_snap=0
#—»
allow_tearing=0
syncobj_enable=1
#—»
warpcursor=1
cursor_hide_timeout=3
#—»
cursor_size=32
cursor_theme=BreezeX-Black
#————————————————————————————|

#————————————————————|
repeat_rate=50
repeat_delay=260
numlockon=1
xkb_rules_layout=latam
xkb_rules_options=grp:alt_shift_toggle,compose:menu
#————————————————————————————————————————————————————|
mouse_natural_scrolling=1
mouse_accel_profile=0
#———————————————————————————|
left_handed=0
#—»
disable_trackpad=1
#——————————————————————|

#—————————————————————————————|
scratchpad_width_ratio=0.97
scratchpad_height_ratio=0.95
#—————————————————————————————|

#———————————————|
tag_carousel=1
#——————————————————————————————————|
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller
#——————————————————————————————————|
