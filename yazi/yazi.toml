[mgr]
ratio = [2, 8, 0]
[opener]
open = [
    { run = 'xdg-open "$@"', desc = "Open" },
]
comic = [
	{ run = 'mcomix %s', orphan = true, for = "unix" },
]    
krita = [
	{ run = 'krita %s', orphan = true, for = "unix" },
]    
[open]
prepend_rules = [
	{ url = "*.cbz", use = "comic" },
	{ url = "*.cbr", use = "comic" },
	{ url = "*.kra", use = "krita" },
]
